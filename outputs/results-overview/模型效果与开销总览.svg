  <line x1="1349" y1="207" x2="1831" y2="207" stroke="#e4e7ea" stroke-width="2"/>
  <text class="column" x="411" y="247" text-anchor="middle">SI-SNR</text>
  <text class="hint" x="411" y="274" text-anchor="middle">越高越好 / dB</text>
  <text class="column" x="673" y="247" text-anchor="middle">PESQ</text>
  <text class="hint" x="673" y="274" text-anchor="middle">越高越好</text>
