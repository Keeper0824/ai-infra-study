  <line x1="82" y1="826" x2="1838" y2="826" stroke="#e1e5e8" stroke-width="2"/>
  <text class="insight-label" x="82" y="860">结论</text>
  <text class="insight" x="162" y="860">语音任务：组合模型最佳（16.45 dB，3.34）</text>
  <line x1="692" y1="835" x2="692" y2="870" stroke="#d7dbdf" stroke-width="2"/>
  <text class="insight" x="728" y="860">通信任务：多尺度模型最佳（18.30 dB，6.87%）</text>
  <line x1="1318" y1="835" x2="1318" y2="870" stroke="#d7dbdf" stroke-width="2"/>
  <text class="insight" x="1354" y="860">资源开销：基线最低</text>
  <text class="note" x="82" y="946">注：颜色按每列相对表现归一化，仅辅助阅读；单元格均保留原始实验数值。</text>
