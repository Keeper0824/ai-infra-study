  <text class="column" x="1459" y="247" text-anchor="middle">参数量</text>
  <text class="hint" x="1459" y="274" text-anchor="middle">越低越好 / M</text>
  <text class="column" x="1721" y="247" text-anchor="middle">60 s 推理耗时</text>
  <text class="hint" x="1721" y="274" text-anchor="middle">越低越好 / s</text>
