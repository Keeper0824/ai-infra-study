<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1058" height="452" viewBox="0 0 1058 452">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.title { font-size: 28px; font-weight: 700; fill: #c5192d; }
.column { font-size: 22px; font-weight: 700; fill: #303840; }
.hint { font-size: 16px; fill: #7a838c; }
.row { font-size: 23px; font-weight: 600; fill: #303840; }
.value { font-size: 25px; font-weight: 700; }
.note { font-size: 18px; fill: #3e464d; }
</style>
<text class="title" x="34" y="34">资源开销</text>
<text class="hint" x="1024" y="34" text-anchor="end">颜色越深表示开销越低</text>
<line x1="34" y1="48" x2="1024" y2="48" stroke="#e0e4e7" stroke-width="2"/>
<text class="column" x="415" y="77" text-anchor="middle">参数量</text><text class="hint" x="415" y="99" text-anchor="middle">越低越好 / M</text><text class="column" x="819" y="77" text-anchor="middle">60 s 语音推理耗时</text><text class="hint" x="819" y="99" text-anchor="middle">越低越好 / s</text><circle cx="42" cy="137" r="8" fill="#7f8c97"/><text class="row" x="62" y="145">基线</text><rect x="220" y="105" width="390" height="64" rx="7" fill="rgb(47,138,133)" stroke="#1f6662" stroke-width="3"/><text class="value" x="415" y="146" text-anchor="middle" fill="#ffffff">2.63</text><rect x="624" y="105" width="390" height="64" rx="7" fill="rgb(47,138,133)" stroke="#1f6662" stroke-width="3"/><text class="value" x="819" y="146" text-anchor="middle" fill="#ffffff">1.01</text><circle cx="42" cy="211" r="8" fill="#648bab"/><text class="row" x="62" y="219">深层</text><rect x="220" y="179" width="390" height="64" rx="7" fill="rgb(108,172,169)"/><text class="value" x="415" y="220" text-anchor="middle" fill="#ffffff">7.36</text><rect x="624" y="179" width="390" height="64" rx="7" fill="rgb(120,178,175)"/><text class="value" x="819" y="220" text-anchor="middle" fill="#ffffff">1.53</text><circle cx="42" cy="285" r="8" fill="#2f8a85"/><text class="row" x="62" y="293">多尺度</text><rect x="220" y="253" width="390" height="64" rx="7" fill="rgb(51,140,135)"/><text class="value" x="415" y="294" text-anchor="middle" fill="#ffffff">2.96</text><rect x="624" y="253" width="390" height="64" rx="7" fill="rgb(89,161,157)"/><text class="value" x="819" y="294" text-anchor="middle" fill="#ffffff">1.31</text><circle cx="42" cy="359" r="8" fill="#a46c7e"/><text class="row" x="62" y="367">组合</text><rect x="220" y="327" width="390" height="64" rx="7" fill="rgb(222,234,234)"/><text class="value" x="415" y="368" text-anchor="middle" fill="#263238">16.11</text><rect x="624" y="327" width="390" height="64" rx="7" fill="rgb(222,234,234)"/><text class="value" x="819" y="368" text-anchor="middle" fill="#263238">2.26</text><line x1="34" y1="410" x2="1024" y2="410" stroke="#e0e4e7" stroke-width="2"/><text class="note" x="34" y="440">基线开销最低；多尺度接近基线，组合模型开销最高。</text></svg>